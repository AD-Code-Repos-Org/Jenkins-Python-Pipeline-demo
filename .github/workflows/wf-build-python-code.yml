---
name: Build Python Code
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
  pull_request:
    branches: ["master"]
jobs:
  build-python-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # Specify the desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: set PythonPATH
        run: echo "PYTHONPATH"=$GITHUB_WORKSPACE >> $GITHUB_ENV

      - name: Run automated tests
        run: |
          #if [ -f pytest.ini ] || [ -d tests ]; then pytest; else echo "No tests found."; fi
          pytest tests --cov=app --cov-report=xml

      - name: Build application (if applicable)
        run: |
          if [ -f setup.py ]; then python setup.py sdist bdist_wheel; else echo "No build script found."; fi
